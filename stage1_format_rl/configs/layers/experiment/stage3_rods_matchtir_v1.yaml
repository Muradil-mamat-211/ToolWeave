schema_version: toolweave.experiment.v1

# This layer answers "what is trained?". Paths, GPU topology, backend memory,
# FSDP placement, and machine-local output roots are intentionally absent.
verl:
  hydra:
    searchpath:
      - pkg://verl.trainer.config
  defaults:
    - ppo_trainer
    - _self_

  custom_reward_function:
    name: compute_score

  data:
    train_batch_size: 20
    max_prompt_length: 8192
    max_response_length: 10000
    return_raw_chat: true
    filter_overlong_prompts: false
    truncation: error
    trust_remote_code: true
    shuffle: false
    seed: 42
    validation_shuffle: false

  actor_rollout_ref:
    hybrid_engine: true
    model:
      trust_remote_code: true
    actor:
      optim:
        lr: 1.0e-6
        lr_warmup_steps_ratio: 0.03
      ppo_epochs: 1
      ppo_mini_batch_size: 20
      use_kl_loss: true
      kl_loss_coef: 0.01
      kl_loss_type: low_var_kl
      clip_ratio_low: 0.2
      clip_ratio_high: 0.28
      clip_ratio_c: 10.0
      grad_clip: 1.0
      entropy_coeff: 0.001
      loss_agg_mode: seq-mean-token-mean
      checkpoint:
        save_contents: [model, optimizer, extra]
        load_contents: [model, optimizer, extra]
    rollout:
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      n: 16
      val_kwargs:
        do_sample: false
        temperature: 0
        top_p: 1.0
        top_k: -1
        n: 1
      multi_turn:
        enable: true
        max_assistant_turns: 100
        max_user_turns: 100
        format: qwen
        use_inference_chat_template: false
        tokenization_sanity_check_mode: "off"
    # Runtime/FSDP fields are injected by the veRL integration adapter.
    ref: {}

  algorithm:
    gamma: 1.0
    lam: 1.0
    adv_estimator: grpo
    norm_adv_by_std_in_grpo: true
    use_kl_in_reward: false
    loss_agg_mode: seq-mean-token-mean
    kl_penalty: kl
    kl_ctrl:
      type: fixed
      kl_coef: 0.0
      target_kl: 0.1
      horizon: 10000
    matchtir_local:
      mode: runtime_interaction_final
      enabled: true
      weight: 1.0
      gamma: 0.9
      matching: hard
      unmatched_penalty: 0.0
      min_group_size: 2
      epsilon: 1.0e-6

  reward_model:
    enable: false
    reward_manager: bfcl

  trainer:
    critic_warmup: 0
    logger: [console]
    project_name: rods_stage1_format_rl
    experiment_name: stage3_rods_matchtir_v1_training_branch
    rollout_data_dir: null
    default_hdfs_dir: null
    save_freq: 20
    max_actor_ckpt_to_keep: 1
    max_critic_ckpt_to_keep: 1
    resume_mode: auto
    resume_from_path: null
    del_local_ckpt_after_load: false
    val_before_train: false
    val_only: false
    test_freq: 20
    total_epochs: 5
    total_training_steps: null
    log_val_generations: 0
    rods_stage3_lifecycle:
      enabled: true
      require_seed_selection_config: true
      boundary_low: 0.20
      boundary_high: 0.85
      # RODS specifies the mechanisms but does not publish one unique numeric
      # default for M, M_tau, or cooldown c. ToolWeave formal training fixes
      # the project choices to M=16, M_tau=4 for each BFCL type, and c=13.
      max_seeds_per_selection: 16
      seed_type_quotas:
        multi_turn_base: 4
        multi_turn_miss_func: 4
        multi_turn_miss_param: 4
        multi_turn_long_context: 4
      seed_cooldown_steps: 13
      injection_ratio: 0.20
      generated_pool_cap: 400
      trial_observation_count: 1
      trial_eviction_threshold: 0.20
      retire_mastered_threshold: 0.95
      retire_too_hard_threshold: 0.20
      stale_after_steps: null

asset_bindings:
  custom_reward_function.path: progress_reward
  data.train_files: stage3_train_400
  data.val_files: bfcl_val_400
  actor_rollout_ref.model.path: stage2_step25_model
  actor_rollout_ref.rollout.multi_turn.interaction_config_path: stage2_interaction_config

output_bindings:
  trainer.validation_data_dir: ${machine.outputs_root}/stage3_rods_matchtir_v1_training_branch/validation_outputs
  trainer.default_local_dir: ${machine.outputs_root}/stage3_rods_matchtir_v1_training_branch/checkpoints
  trainer.rods_stage3_lifecycle.seed_output_path: ${machine.artifacts_root}/stage3_queues/boundary_seeds.jsonl
  trainer.rods_stage3_lifecycle.candidate_input_path: ${machine.artifacts_root}/stage3_queues/validated_candidates.jsonl
  trainer.rods_stage3_lifecycle.state_path: ${machine.artifacts_root}/stage3_queues/training_lifecycle_state.json
