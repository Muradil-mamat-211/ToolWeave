<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ToolWeave three-stage curriculum and asynchronous Stage 3 loop</title>
  <desc id="desc">Qwen3-4B passes through Stage 1, Stage 2, and Stage 3. Global policy credit comes from normalized Progress Reward, local policy credit comes from runtime provenance and per-user-turn call matching, and boundary selection consumes grouped Progress Reward only. Verified candidates are admitted only in the next epoch.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .neutral { fill: #f8fafc; stroke: #64748b; stroke-width: 2.2; }
      .policy { fill: #eaf2ff; stroke: #2563eb; stroke-width: 2.2; }
      .rods { fill: #e6f7f4; stroke: #0f766e; stroke-width: 2.2; }
      .toolweave { fill: #fff3e3; stroke: #d97706; stroke-width: 2.2; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .stage { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #0f172a; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .lane { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 750; letter-spacing: 1.2px; fill: #334155; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #0f766e; stroke-width: 2.6; }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="900"/>
  <text class="title" x="720" y="48" text-anchor="middle">ToolWeave: Three-Stage Curriculum</text>
  <text class="subtitle" x="720" y="76" text-anchor="middle">Policy learning combines global progress and local interaction credit; data evolution consumes grouped R_P only</text>

  <!-- Curriculum -->
  <rect class="neutral" x="70" y="115" rx="18" ry="18" width="220" height="92"/>
  <text class="stage" x="180" y="151" text-anchor="middle">Qwen3-4B</text>
  <text class="small" x="180" y="179" text-anchor="middle">starting policy</text>

  <rect class="policy" x="370" y="105" rx="18" ry="18" width="250" height="112"/>
  <text class="stage" x="495" y="142" text-anchor="middle">Stage 1</text>
  <text class="label" x="495" y="169" text-anchor="middle">Tool-Use Cold Start</text>
  <text class="small" x="495" y="194" text-anchor="middle">format + execution</text>

  <rect class="rods" x="700" y="105" rx="18" ry="18" width="250" height="112"/>
  <text class="stage" x="825" y="142" text-anchor="middle">Stage 2</text>
  <text class="label" x="825" y="169" text-anchor="middle">Progress RL</text>
  <text class="small" x="825" y="194" text-anchor="middle">fixed-denominator R_P</text>

  <rect class="neutral" x="1030" y="105" rx="18" ry="18" width="300" height="112"/>
  <text class="stage" x="1180" y="142" text-anchor="middle">Stage 3</text>
  <text class="label" x="1180" y="169" text-anchor="middle">Boundary-Guided Online RL</text>
  <text class="small" x="1180" y="194" text-anchor="middle">dual credit + data evolution</text>

  <path class="arrow" d="M290 161 H360"/>
  <path class="arrow" d="M620 161 H690"/>
  <path class="arrow" d="M950 161 H1020"/>

  <!-- Stage 3 rollout outputs and parallel branches -->
  <path class="arrow" d="M1180 217 V257 H720 V275"/>
  <rect class="rods" x="555" y="275" rx="18" ry="18" width="330" height="76"/>
  <text class="label" x="720" y="305" text-anchor="middle">K stateful BFCL rollouts</text>
  <text class="small" x="720" y="330" text-anchor="middle">R_P + runtime provenance</text>

  <path class="branch" d="M720 351 V378 H390"/>
  <path class="branch" d="M720 378 H1050"/>
  <path class="arrow" d="M390 378 V403"/>
  <path class="arrow" d="M1050 378 V403"/>

  <!-- Policy lane -->
  <rect class="panel" x="55" y="405" rx="22" ry="22" width="650" height="300"/>
  <text class="lane" x="85" y="440">POLICY LEARNING</text>
  <text class="small" x="675" y="440" text-anchor="end">current update does not wait for synthesis</text>

  <rect class="rods" x="80" y="470" rx="14" ry="14" width="205" height="80"/>
  <text class="label" x="182.5" y="497" text-anchor="middle">Global policy signal</text>
  <text class="small" x="182.5" y="522" text-anchor="middle">R_P → same-prompt norm</text>
  <text class="small" x="182.5" y="542" text-anchor="middle">A^g</text>

  <rect class="toolweave" x="80" y="580" rx="14" ry="14" width="205" height="95"/>
  <text class="label" x="182.5" y="607" text-anchor="middle">Local policy signal</text>
  <text class="small" x="182.5" y="630" text-anchor="middle">provenance + per-turn GT</text>
  <text class="small" x="182.5" y="650" text-anchor="middle">call matching</text>
  <text class="small" x="182.5" y="670" text-anchor="middle">runtime depth → A^ℓ</text>

  <rect class="policy" x="320" y="525" rx="14" ry="14" width="165" height="78"/>
  <text class="label" x="402.5" y="556" text-anchor="middle">Fused advantage</text>
  <text class="small" x="402.5" y="581" text-anchor="middle">A^TW = A^g + A^ℓ</text>

  <path class="arrow" d="M285 510 H300 V548 H310"/>
  <path class="arrow" d="M285 627 H300 V580 H310"/>

  <rect class="policy" x="530" y="525" rx="14" ry="14" width="140" height="78"/>
  <text class="label" x="600" y="556" text-anchor="middle">GRPO framework</text>
  <text class="small" x="600" y="581" text-anchor="middle">PPO-style clipping</text>
  <path class="arrow" d="M485 564 H520"/>

  <rect class="policy" x="520" y="625" rx="14" ry="14" width="160" height="55"/>
  <text class="label" x="600" y="649" text-anchor="middle">Updated policy</text>
  <text class="small" x="600" y="669" text-anchor="middle">future rollout</text>
  <path class="arrow" d="M600 603 V615"/>

  <!-- Data lane -->
  <rect class="panel" x="735" y="405" rx="22" ry="22" width="650" height="300"/>
  <text class="lane" x="765" y="440">ASYNC DATA EVOLUTION</text>
  <text class="small" x="1355" y="440" text-anchor="end">RODS-style branch</text>

  <rect class="rods" x="770" y="475" rx="14" ry="14" width="155" height="78"/>
  <text class="label" x="847.5" y="506" text-anchor="middle">Boundary</text>
  <text class="small" x="847.5" y="531" text-anchor="middle">grouped R_P only</text>

  <rect class="rods" x="955" y="475" rx="14" ry="14" width="175" height="78"/>
  <text class="label" x="1042.5" y="506" text-anchor="middle">Async synthesis</text>
  <text class="small" x="1042.5" y="531" text-anchor="middle">seed queue</text>

  <rect class="toolweave" x="1160" y="475" rx="14" ry="14" width="190" height="78"/>
  <text class="label" x="1255" y="506" text-anchor="middle">Verified candidates</text>
  <text class="small" x="1255" y="531" text-anchor="middle">VM + semantic gates</text>

  <path class="arrow" d="M925 514 H945"/>
  <path class="arrow" d="M1130 514 H1150"/>

  <rect class="rods" x="955" y="600" rx="14" ry="14" width="220" height="70"/>
  <text class="label" x="1065" y="629" text-anchor="middle">Epoch n+1 active pool</text>
  <text class="small" x="1065" y="652" text-anchor="middle">never same-epoch replay</text>
  <path class="arrow" d="M1255 553 V575 H1065 V590"/>

  <!-- Future cycle -->
  <rect class="neutral" x="560" y="775" rx="18" ry="18" width="320" height="78"/>
  <text class="label" x="720" y="806" text-anchor="middle">Future active training cycle</text>
  <text class="small" x="720" y="831" text-anchor="middle">updated policy + eligible pool → rollouts</text>
  <path class="dash" d="M600 680 V735 H650 V765"/>
  <path class="dash" d="M1065 670 V735 H790 V765"/>

  <!-- Compact legend -->
  <circle cx="102" cy="873" r="7" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text class="small" x="118" y="878">policy / RL</text>
  <circle cx="235" cy="873" r="7" fill="#e6f7f4" stroke="#0f766e" stroke-width="2"/>
  <text class="small" x="251" y="878">RODS-style global / boundary</text>
  <circle cx="493" cy="873" r="7" fill="#fff3e3" stroke="#d97706" stroke-width="2"/>
  <text class="small" x="509" y="878">ToolWeave local / validation</text>
</svg>
