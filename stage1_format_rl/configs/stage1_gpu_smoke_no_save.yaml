# Standalone smoke-only config. Never use this file for formal training.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

custom_reward_function:
  path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/format_reward.py
  name: compute_score

data:
  train_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/smoke/smoke4_train_4.parquet
  val_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/smoke/smoke1_functional.parquet
  max_prompt_length: 8192
  max_response_length: 10000
  train_batch_size: 4
  val_batch_size: 1
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: true
  shuffle: false
  validation_shuffle: false

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: /root/autodl-tmp/rods-workspace/models/Qwen3-4B
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_fused_kernels: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 65536
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    grad_clip: 1.0
    entropy_coeff: 0.001
    loss_agg_mode: seq-mean-token-mean
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: sglang
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.8
    max_num_batched_tokens: 131072
    max_model_len: 32768
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 1.0
      n: 2
      do_sample: true
    multi_turn:
      enable: true
      max_assistant_turns: 100
      max_user_turns: 100
      interaction_config_path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/config/multi_turn_fc_interaction_config.yaml
      format: qwen
      use_inference_chat_template: false
      tokenization_sanity_check_mode: "off"
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    entropy_from_logits_with_chunking: true
    fsdp_config:
      param_offload: false

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  loss_agg_mode: seq-mean-token-mean
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

reward_model:
  enable: false
  reward_manager: bfcl

trainer:
  critic_warmup: 0
  logger:
    - console
  project_name: rods_stage1_gpu_smoke
  experiment_name: qwen3_4b_k16_no_save
  rollout_data_dir: null
  validation_data_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/gpu_smoke_rollouts
  default_local_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/gpu_smoke_tmp/no_checkpoints
  default_hdfs_dir: null
  n_gpus_per_node: 2
  nnodes: 1
  # `_save_checkpoint()` is called only when this value is greater than zero.
  save_freq: -1
  resume_mode: disable
  val_before_train: true
  val_only: true
  test_freq: -1
  total_epochs: 1
  total_training_steps: 1
  log_val_generations: 0

ray_init:
  num_cpus: 88
