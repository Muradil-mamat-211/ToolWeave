# Online Stage-3 smoke: physical GPU1 only. GPU0 is reserved for the Gemma
# generator service. Exactly 64 rows / batch 32 / one epoch yields two updates.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

custom_reward_function:
  path: /root/autodl-tmp/rods-workspace/stage1_format_rl/rewards/rods_stage2_progress_reward.py
  name: compute_score

data:
  train_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/configs/train_64_balanced.parquet
  val_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/bfcl_val_400.parquet
  train_batch_size: 32
  max_prompt_length: 8192
  max_response_length: 10000
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: true
  shuffle: false
  seed: 42
  validation_shuffle: false
  dataloader_num_workers: 0

actor_rollout_ref:
  model:
    path: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage2_eval/merged/global_step_25
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    trust_remote_code: true
    use_remove_padding: true
    use_fused_kernels: true
  actor:
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    ppo_epochs: 1
    # Prompt-group unit. The single-GPU worker multiplies by K=16, producing
    # one 512-trajectory PPO mini-batch and exactly one optimizer step/update.
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    # Normal 20K PPO dynamic-token budget. The strict packer makes this a real
    # upper bound (the legacy balanced partitioner reached 22,873 at 20K).
    # Complete trajectories remain indivisible.
    ppo_max_token_len_per_gpu: 20480
    # The legacy balanced partitioner may exceed the nominal target. Enforce
    # a true cap for activation-heavy PPO forward/backward only.
    ppo_enforce_max_token_len: true
    ulysses_sequence_parallel_size: 1
    entropy_checkpointing: false
    entropy_from_logits_with_chunking: true
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    grad_clip: 1.0
    entropy_coeff: 0.001
    loss_agg_mode: seq-mean-token-mean
    checkpoint:
      save_contents: [model, optimizer, extra]
      load_contents: [model, optimizer, extra]
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      offload_policy: false
  rollout:
    name: sglang
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 16
    tensor_model_parallel_size: 1
    # 0.50 exhausted physical GPU1 when Update-1 AdamW state remained
    # resident and Update-2 rebuilt the SGLang KV pool. 0.45 preserves the
    # rollout/model-length semantics while adding about 4.7 GiB headroom.
    gpu_memory_utilization: 0.45
    max_num_batched_tokens: 131072
    max_model_len: 32768
    # Resume SGLang weights first, synchronize the updated actor, then resume
    # its KV cache. This prevents the full KV allocation from competing with
    # the one-rank FSDP state-dict materialization after optimizer.step.
    multi_stage_wake_up: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    # No-grad old-policy forward: dynamically pack trajectories up to this
    # effective-token budget.  Calibrated separately from PPO backward.
    log_prob_max_token_len_per_gpu: 131072
    engine_kwargs:
      sglang:
        attention_backend: triton
        sampling_backend: flashinfer
        # Official sgl-kernel 0.1.9+cu128 wheel includes native sm_120 cubins.
        # "cuda" keeps SGLang's compiled CustomOp dispatch enabled; "native"
        # is reserved by this smoke adapter for the PyTorch fallback path.
        custom_op_backend: cuda
        # SGLang 0.4.8 otherwise selects conservative H20-like 8K/16K
        # prefill limits for a 96GB card.  These values were exercised on the
        # actual physical GPU1 before the counted smoke updates.
        chunked_prefill_size: 16384
        max_prefill_tokens: 32768
    val_kwargs:
      do_sample: false
      temperature: 0
      top_p: 1.0
      top_k: -1
      n: 1
    multi_turn:
      enable: true
      max_assistant_turns: 100
      max_user_turns: 100
      interaction_config_path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/config/multi_turn_fc_interaction_config_stage2.yaml
      format: qwen
      use_inference_chat_template: false
      tokenization_sanity_check_mode: "off"
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    # No-grad reference-policy forward; keep identical to old-policy packing.
    log_prob_max_token_len_per_gpu: 131072
    entropy_from_logits_with_chunking: true
    fsdp_config:
      # The reference is used only for its no-grad log-prob pass. Offload its
      # parameters between uses to free actor-backward headroom; actor and
      # optimizer state remain fully GPU resident.
      param_offload: true
      # On a one-rank FSDP1 worker, native CPUOffload leaves the NO_SHARD
      # reference allocation resident after forward. Use veRL's whole-model
      # phase load/offload helpers so PPO begins without reference parameters.
      phase_param_offload: true
      offload_policy: false

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  loss_agg_mode: seq-mean-token-mean
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    target_kl: 0.1
    horizon: 10000
  matchtir_local:
    mode: runtime_interaction_final
    enabled: true
    weight: 1.0
    gamma: 0.9
    matching: hard
    unmatched_penalty: 0.0
    min_group_size: 2
    epsilon: 1.0e-6

reward_model:
  enable: false
  reward_manager: bfcl

# GRPO does not instantiate a critic, but keep every dormant model-state
# option explicit so the resolved smoke config cannot be misread as offloaded
# or checkpointed execution.
critic:
  model:
    enable_gradient_checkpointing: false
    enable_activation_offload: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      offload_policy: false

trainer:
  critic_warmup: 0
  logger: [console]
  project_name: rods_stage1_format_rl
  experiment_name: stage3_online_smoke_2x_rtxpro6000_two_updates
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  save_freq: -1
  test_freq: -1
  val_before_train: false
  resume_mode: disable
  default_local_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/checkpoint/SMOKE_ONLY_step2
  validation_data_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/training/validation_disabled
  rollout_data_dir: null
  default_hdfs_dir: null
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  resume_from_path: null
  del_local_ckpt_after_load: false
  val_only: false
  total_training_steps: null
  log_val_generations: 0
  rods_stage3_lifecycle:
    enabled: true
    require_seed_selection_config: true
    seed_output_path: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/queues/boundary_seeds.jsonl
    candidate_input_path: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/queues/validated_candidates.jsonl
    state_path: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/stage3_online_smoke_2x_rtxpro6000_20260811T081412Z/queues/training_lifecycle_state.json
    max_seeds_per_selection: 16
    seed_type_quotas:
      multi_turn_base: 4
      multi_turn_miss_func: 4
      multi_turn_miss_param: 4
      multi_turn_long_context: 4
    seed_cooldown_steps: 13
    boundary_low: 0.20
    boundary_high: 0.85
    injection_ratio: 0.20
    generated_pool_cap: 400
    trial_observation_count: 1
    trial_eviction_threshold: 0.20
    retire_mastered_threshold: 0.95
    retire_too_hard_threshold: 0.20
    stale_after_steps: null

ray_init:
  num_cpus: 38
