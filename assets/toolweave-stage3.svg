<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">ToolWeave Stage 3 method</title>
  <desc id="desc">Four panels show multi-turn rollout progress, one-to-one call matching, runtime-interaction dual-level advantage estimation, and asynchronous boundary-guided data evolution. Unparsed non-answer interactions remain in the local chain at zero immediate reward; valid answers receive global credit only.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #fbfdff; stroke: #cbd5e1; stroke-width: 2; }
      .policy { fill: #eaf2ff; stroke: #2563eb; stroke-width: 2; }
      .rods { fill: #e6f7f4; stroke: #0f766e; stroke-width: 2; }
      .local { fill: #fff3e3; stroke: #d97706; stroke-width: 2; }
      .neutral { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .panelTitle { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 650; fill: #0f172a; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 550; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.3; marker-end: url(#arrow); }
      .blueArrow { fill: none; stroke: #2563eb; stroke-width: 2.3; marker-end: url(#arrowBlue); }
      .tealArrow { fill: none; stroke: #0f766e; stroke-width: 2.3; marker-end: url(#arrowTeal); }
      .orangeArrow { fill: none; stroke: #d97706; stroke-width: 2.3; marker-end: url(#arrowOrange); }
      .match { fill: none; stroke: #d97706; stroke-width: 3; }
      .unmatched { stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="1060"/>
  <text class="title" x="720" y="42" text-anchor="middle">ToolWeave Stage 3</text>
  <text class="subtitle" x="720" y="69" text-anchor="middle">Progress-based global learning, MatchTIR-derived local credit, and asynchronous verified data evolution</text>

  <!-- Panel A -->
  <rect class="panel" x="35" y="95" rx="20" ry="20" width="670" height="405"/>
  <text class="panelTitle" x="65" y="132">(a) Multi-Turn RL</text>
  <text class="small" x="65" y="158">One prompt, K stateful BFCL rollouts, one fixed-denominator progress signal per rollout</text>

  <rect class="neutral" x="80" y="205" rx="14" ry="14" width="135" height="64"/>
  <text class="label" x="147.5" y="233" text-anchor="middle">Prompt q</text>
  <text class="tiny" x="147.5" y="254" text-anchor="middle">tools + initial state</text>

  <rect class="policy" x="275" y="195" rx="14" ry="14" width="165" height="84"/>
  <text class="label" x="357.5" y="226" text-anchor="middle">K rollouts</text>
  <text class="tiny" x="357.5" y="249" text-anchor="middle">τ₁ · τ₂ · … · τₖ</text>
  <text class="tiny" x="357.5" y="268" text-anchor="middle">multi-turn actions</text>

  <rect class="neutral" x="500" y="195" rx="14" ry="14" width="160" height="84"/>
  <text class="label" x="580" y="226" text-anchor="middle">BFCL VM</text>
  <text class="tiny" x="580" y="249" text-anchor="middle">state transitions</text>
  <text class="tiny" x="580" y="268" text-anchor="middle">observations</text>

  <path class="arrow" d="M215 237 H265"/>
  <path class="arrow" d="M440 237 H490"/>

  <rect class="rods" x="252" y="345" rx="16" ry="16" width="210" height="88"/>
  <text class="label" x="357" y="378" text-anchor="middle">Progress Reward R_P</text>
  <text class="tiny" x="357" y="402" text-anchor="middle">successful expected turns</text>
  <text class="tiny" x="357" y="422" text-anchor="middle">÷ all expected turns</text>
  <path class="tealArrow" d="M580 279 V320 H357 V335"/>

  <text class="small" x="357" y="470" text-anchor="middle">R_P feeds global policy credit and boundary statistics</text>

  <!-- Panel B -->
  <rect class="panel" x="735" y="95" rx="20" ry="20" width="670" height="405"/>
  <text class="panelTitle" x="765" y="132">(b) Tool Matching</text>
  <text class="small" x="765" y="158">All calls in one BFCL user turn share one maximum-weight assignment</text>

  <text class="small" x="825" y="196" text-anchor="middle">Predicted calls</text>
  <text class="small" x="1125" y="196" text-anchor="middle">GT calls</text>

  <circle class="local" cx="825" cy="235" r="31"/>
  <circle class="local" cx="825" cy="315" r="31"/>
  <circle class="local" cx="825" cy="395" r="31"/>
  <text class="label" x="825" y="241" text-anchor="middle">P1</text>
  <text class="label" x="825" y="321" text-anchor="middle">P2</text>
  <text class="label" x="825" y="401" text-anchor="middle">P3</text>

  <circle class="neutral" cx="1125" cy="255" r="31"/>
  <circle class="neutral" cx="1125" cy="355" r="31"/>
  <text class="label" x="1125" y="261" text-anchor="middle">G1</text>
  <text class="label" x="1125" y="361" text-anchor="middle">G2</text>

  <path class="match" d="M856 235 L1094 255"/>
  <path class="match" d="M856 315 L1094 355"/>
  <line class="unmatched" x1="882" y1="384" x2="902" y2="404"/>
  <line class="unmatched" x1="902" y1="384" x2="882" y2="404"/>
  <text class="tiny" x="975" y="280" text-anchor="middle">call similarity matrix</text>
  <text class="tiny" x="975" y="299" text-anchor="middle">name + args + content</text>

  <rect class="local" x="1205" y="220" rx="14" ry="14" width="155" height="76"/>
  <text class="label" x="1282.5" y="249" text-anchor="middle">Hungarian</text>
  <text class="tiny" x="1282.5" y="272" text-anchor="middle">one-to-one optimum</text>
  <path class="orangeArrow" d="M1156 305 H1180 V258 H1195"/>

  <rect class="local" x="1185" y="345" rx="14" ry="14" width="175" height="76"/>
  <text class="label" x="1272.5" y="374" text-anchor="middle">Call rewards</text>
  <text class="tiny" x="1272.5" y="397" text-anchor="middle">calls mean → one r_j</text>
  <path class="orangeArrow" d="M1282.5 296 V335"/>

  <text class="small" x="1035" y="468" text-anchor="middle">P3 stays unmatched: duplicate GT credit is not reused</text>

  <!-- Panel C -->
  <rect class="panel" x="35" y="530" rx="20" ry="20" width="820" height="450"/>
  <text class="panelTitle" x="65" y="567">(c) Dual-Level Advantage</text>
  <text class="small" x="65" y="593">Global trajectory signal and local runtime-interaction residual meet at actor optimization</text>

  <text class="small" x="75" y="643">GLOBAL</text>
  <rect class="rods" x="145" y="612" rx="13" ry="13" width="125" height="60"/>
  <text class="label" x="207.5" y="649" text-anchor="middle">R_P</text>
  <rect class="rods" x="320" y="612" rx="13" ry="13" width="155" height="60"/>
  <text class="label" x="397.5" y="638" text-anchor="middle">Group</text>
  <text class="tiny" x="397.5" y="658" text-anchor="middle">normalization</text>
  <rect class="rods" x="525" y="612" rx="13" ry="13" width="145" height="60"/>
  <text class="label" x="597.5" y="649" text-anchor="middle">A_global</text>
  <path class="tealArrow" d="M270 642 H310"/>
  <path class="tealArrow" d="M475 642 H515"/>

  <text class="small" x="75" y="746">LOCAL</text>
  <rect class="local" x="145" y="710" rx="13" ry="13" width="120" height="68"/>
  <text class="label" x="205" y="737" text-anchor="middle">Call rewards</text>
  <text class="tiny" x="205" y="759" text-anchor="middle">parsed calls only</text>
  <rect class="local" x="295" y="710" rx="13" ry="13" width="120" height="82"/>
  <text class="label" x="355" y="735" text-anchor="middle">Interaction mean</text>
  <text class="tiny" x="355" y="757" text-anchor="middle">unparsed: r_j = 0</text>
  <text class="tiny" x="355" y="778" text-anchor="middle">retained</text>
  <rect class="local" x="445" y="710" rx="13" ry="13" width="135" height="68"/>
  <text class="label" x="512.5" y="737" text-anchor="middle">Turn-local</text>
  <text class="tiny" x="512.5" y="759" text-anchor="middle">discounted return</text>
  <rect class="local" x="605" y="710" rx="13" ry="13" width="165" height="82"/>
  <text class="label" x="687.5" y="735" text-anchor="middle">Ragged (q,u,j)</text>
  <text class="tiny" x="687.5" y="757" text-anchor="middle">same runtime depth</text>
  <text class="tiny" x="687.5" y="778" text-anchor="middle">singleton → A_local=0</text>
  <path class="orangeArrow" d="M265 744 H285"/>
  <path class="orangeArrow" d="M415 744 H435"/>
  <path class="orangeArrow" d="M580 744 H595"/>

  <rect class="local" x="615" y="820" rx="13" ry="13" width="145" height="62"/>
  <text class="label" x="687.5" y="857" text-anchor="middle">A_local</text>
  <path class="orangeArrow" d="M687.5 792 V810"/>

  <rect class="policy" x="305" y="820" rx="15" ry="15" width="220" height="66"/>
  <text class="label" x="415" y="848" text-anchor="middle">A_global + A_local</text>
  <text class="tiny" x="415" y="871" text-anchor="middle">additive residual, weight 1.0</text>
  <path class="tealArrow" d="M597.5 672 V692 H130 V800 H415 V810"/>
  <path class="orangeArrow" d="M615 851 H535"/>

  <rect class="policy" x="335" y="920" rx="13" ry="13" width="160" height="46"/>
  <text class="label" x="415" y="949" text-anchor="middle">PPO / GRPO</text>
  <path class="blueArrow" d="M415 886 V910"/>
  <text class="tiny" x="75" y="902">valid answer: excluded from local chain</text>
  <text class="tiny" x="75" y="921">answer tokens: global-only</text>

  <!-- Panel D -->
  <rect class="panel" x="885" y="530" rx="20" ry="20" width="520" height="450"/>
  <text class="panelTitle" x="915" y="567">(d) Online Evolution</text>
  <text class="small" x="915" y="593">Asynchronous, validated, and never fed back in the same epoch</text>

  <rect class="rods" x="945" y="625" rx="14" ry="14" width="170" height="62"/>
  <text class="label" x="1030" y="651" text-anchor="middle">Mean R_P</text>
  <text class="tiny" x="1030" y="672" text-anchor="middle">K-rollout group</text>

  <rect class="rods" x="1175" y="625" rx="14" ry="14" width="170" height="62"/>
  <text class="label" x="1260" y="651" text-anchor="middle">Boundary seed</text>
  <text class="tiny" x="1260" y="672" text-anchor="middle">threshold + priority</text>
  <path class="tealArrow" d="M1115 656 H1165"/>

  <rect class="rods" x="1175" y="745" rx="14" ry="14" width="170" height="62"/>
  <text class="label" x="1260" y="771" text-anchor="middle">Async generator</text>
  <text class="tiny" x="1260" y="792" text-anchor="middle">real BFCL VM</text>
  <path class="tealArrow" d="M1260 687 V735"/>

  <rect class="local" x="945" y="745" rx="14" ry="14" width="170" height="62"/>
  <text class="label" x="1030" y="771" text-anchor="middle">Validation</text>
  <text class="tiny" x="1030" y="792" text-anchor="middle">semantic + fresh VM</text>
  <path class="orangeArrow" d="M1175 776 H1125"/>

  <rect class="rods" x="945" y="865" rx="14" ry="14" width="210" height="66"/>
  <text class="label" x="1050" y="892" text-anchor="middle">Epoch n+1 active pool</text>
  <text class="tiny" x="1050" y="915" text-anchor="middle">future rollouts only</text>
  <path class="tealArrow" d="M1030 807 V855"/>

  <text class="small" x="1265" y="900" text-anchor="middle">A_local never enters</text>
  <text class="small" x="1265" y="922" text-anchor="middle">boundary selection</text>

  <!-- Compact provenance legend -->
  <circle cx="390" cy="1030" r="6" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text class="tiny" x="404" y="1035">policy / optimization</text>
  <circle cx="610" cy="1030" r="6" fill="#e6f7f4" stroke="#0f766e" stroke-width="2"/>
  <text class="tiny" x="624" y="1035">RODS-style global / boundary</text>
  <circle cx="895" cy="1030" r="6" fill="#fff3e3" stroke="#d97706" stroke-width="2"/>
  <text class="tiny" x="909" y="1035">ToolWeave local / validation</text>
</svg>
