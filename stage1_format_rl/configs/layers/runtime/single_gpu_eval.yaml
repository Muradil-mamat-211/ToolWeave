schema_version: toolweave.runtime.v1
runtime:
  cluster_mode: local
  data:
    dataloader_num_workers: 0
  roles:
    learner:
      nodes:
        node-0: [0]
      cpu_cores: 24
      ram_gib: 110
    generator:
      nodes: {}
      cpu_cores: 0
      ram_gib: 0
  ray:
    num_cpus: auto
    cpus_per_worker: 1
    placement_strategy: STRICT_PACK
    address: null
  rollout:
    backend: sglang
    tensor_parallel_size: 1
    data_parallel_size: auto
    replicas: auto
    gpu_memory_utilization: 0.72
    max_num_batched_tokens: 65536
    max_model_len: 32768
    multi_stage_wake_up: false
  fsdp:
    world_size: auto
    sequence_parallel_size: 1
    gradient_checkpointing: false
    activation_offload: false
    use_remove_padding: true
    use_fused_kernels: true
    actor_param_offload: false
    actor_optimizer_offload: false
    reference_param_offload: false
  batching:
    dynamic: true
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    actor_micro_batch_size_per_gpu: 1
    actor_max_token_len_per_gpu: 20480
    rollout_logprob_micro_batch_size_per_gpu: 1
    rollout_logprob_max_token_len_per_gpu: 32768
    reference_logprob_micro_batch_size_per_gpu: 1
    reference_logprob_max_token_len_per_gpu: 32768
  # Specialized BFCL100 server runtime. These values intentionally differ
  # from training rollout limits; only TP is derived from TopologyPlan.
  evaluation_server:
    host: 127.0.0.1
    port: 31000
    dtype: bfloat16
    max_used_memory_mib: 2048
    sglang:
      context_length: 32768
      memory_fraction_static: 0.90
      max_running_requests: 24
      cuda_graph_max_batch_size: 32
      attention_backend: triton
      sampling_backend: flashinfer
      enable_tokenizer_batch_encode: true
    vllm:
      max_model_len: 262144
      gpu_memory_utilization: 0.90
      max_num_seqs: 32
      max_num_batched_tokens: 65536
      enable_prefix_caching: true
      language_model_only: true
      skip_mm_profiling: true
      generation_config: vllm
