# RODS Stage 2: Base Reasoning with Progress Reward (plain, non-augmented env)
# Start model: Stage 1 checkpoint/update 25 (merged HF).
# Reward: official bfcl_reward.py::compute_score, score == progress (0/1 turn mean).
# Environment: standard, non-augmented (is_augmented=false, func_source_code_wo_aug).
# RODS Stage 3 components (boundary detector / online synthesis / replay buffer /
#   data expansion): ALL OFF (not present in this codebase by design).
# Budget: 100 Base prompts / batch 20 = 5 updates/epoch, max 5 epochs = 25 updates.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

custom_reward_function:
  # RODS Stage 2 progress reward wrapper (fixed expected_user_turns denominator).
  path: /root/autodl-tmp/rods-workspace/stage1_format_rl/rewards/rods_stage2_progress_reward.py
  name: compute_score

data:
  # ONLY official Base 100. NO Long Context / Missing Function / Missing Parameter.
  train_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/bfcl_stage1_train_base_100_shuffled_seed42.parquet
  # Primary validation: Base-only 100 (full gate).
  val_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/checkpoint_gate_eval/val_base_100.parquet
  train_batch_size: 20
  max_prompt_length: 8192
  max_response_length: 10000
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: true
  shuffle: false
  seed: 42
  validation_shuffle: false

actor_rollout_ref:
  hybrid_engine: true
  model:
    # Stage 1 update-25 merged weights as the Stage 2 starting point.
    path: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/gate_vs_base/merged/global_step_25
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_fused_kernels: true
  actor:
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    ppo_epochs: 1
    ppo_mini_batch_size: 20
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 20480
    ulysses_sequence_parallel_size: 2
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    # RODS paper Stage 2: FIXED loss-side KL (0.01), no reward-side KL.
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    grad_clip: 1.0
    entropy_coeff: 0.001
    loss_agg_mode: seq-mean-token-mean
    checkpoint:
      save_contents: [model, optimizer, extra]
      load_contents: [model, optimizer, extra]
    fsdp_config:
      param_offload: false
      optimizer_offload: true
  rollout:
    name: sglang
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.55
    multi_stage_wake_up: false
    max_num_batched_tokens: 131072
    max_model_len: 32768
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    val_kwargs:
      do_sample: false
      temperature: 0
      top_p: 1.0
      top_k: -1
      n: 1
    multi_turn:
      enable: true
      max_assistant_turns: 100
      max_user_turns: 100
      # Stage-2 interaction config: environment_feedback_mode=standard, is_augmented=false.
      interaction_config_path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/config/multi_turn_fc_interaction_config_stage2.yaml
      format: qwen
      use_inference_chat_template: false
      tokenization_sanity_check_mode: "off"
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    entropy_from_logits_with_chunking: true
    fsdp_config:
      param_offload: true

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  # RODS Stage 2: KL is a loss-side regularizer ONLY; reward stays pure progress.
  use_kl_in_reward: false
  loss_agg_mode: seq-mean-token-mean
  kl_penalty: kl
  kl_ctrl:
    type: fixed          # adaptive reward-side KL controller disabled
    kl_coef: 0.0         # no reward-side KL penalty
    target_kl: 0.1
    horizon: 10000

reward_model:
  enable: false
  reward_manager: bfcl

trainer:
  critic_warmup: 0
  logger: [console]
  project_name: rods_stage1_format_rl
  experiment_name: stage2_qwen3_4b_k16_base_progress_batch20_plain_env
  rollout_data_dir: null
  validation_data_dir: /root/autodl-tmp/rods-workspace/outputs/stage2_qwen3_4b_k16_base_progress_batch20_plain_env/validation_outputs
  default_local_dir: /root/autodl-tmp/rods-workspace/outputs/stage2_qwen3_4b_k16_base_progress_batch20_plain_env/checkpoints
  default_hdfs_dir: null
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: 5
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  resume_mode: auto
  resume_from_path: null
  del_local_ckpt_after_load: false
  val_before_train: false
  val_only: false
  # Budget: max 5 epochs = 25 updates. Validate each epoch boundary.
  test_freq: 5
  total_epochs: 5
  total_training_steps: null
  log_val_generations: 0
