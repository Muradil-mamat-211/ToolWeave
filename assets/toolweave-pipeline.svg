<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ToolWeave staged training and verification loop</title>
  <desc id="desc">Qwen3-4B moves through Stage 1 and Stage 2 into Stage 3, where capability-boundary detection, verified synthesis, semantic validation, and dynamic replay close the loop back into training.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#14B8A6" />
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#0F172A" />
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="500" rx="28" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />
  <text x="600" y="42" text-anchor="middle" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700">ToolWeave staged curriculum and closed-loop replay</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0F172A">
    <rect x="42" y="74" width="190" height="112" rx="18" fill="#E6FFFB" stroke="#0F766E" stroke-width="3" />
    <text x="137" y="111" text-anchor="middle" font-size="16" font-weight="700">Qwen3-4B</text>
    <text x="137" y="137" text-anchor="middle" font-size="13">verified starting</text>
    <text x="137" y="157" text-anchor="middle" font-size="13">checkpoint</text>

    <rect x="288" y="74" width="205" height="112" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <text x="390" y="108" text-anchor="middle" font-size="16" font-weight="700">Stage 1</text>
    <text x="390" y="134" text-anchor="middle" font-size="13">Tool-use cold start</text>
    <text x="390" y="155" text-anchor="middle" font-size="13">format + interaction</text>

    <rect x="550" y="74" width="205" height="112" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <text x="652" y="108" text-anchor="middle" font-size="16" font-weight="700">Stage 2</text>
    <text x="652" y="134" text-anchor="middle" font-size="13">Progress-reward RL</text>
    <text x="652" y="155" text-anchor="middle" font-size="13">task completion</text>

    <rect x="812" y="62" width="342" height="136" rx="18" fill="#FFF7ED" stroke="#C2410C" stroke-width="3" />
    <text x="983" y="95" text-anchor="middle" font-size="16" font-weight="700">Stage 3 · boundary-guided online RL</text>
    <text x="983" y="123" text-anchor="middle" font-size="13">detect capability boundary</text>
    <text x="983" y="145" text-anchor="middle" font-size="13">synthesize + verify tool-use data</text>
    <text x="983" y="167" text-anchor="middle" font-size="13">global trajectory + local tool credit</text>
  </g>

  <path d="M232 130H278" fill="none" stroke="#14B8A6" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M493 130H540" fill="none" stroke="#14B8A6" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M755 130H802" fill="none" stroke="#14B8A6" stroke-width="4" marker-end="url(#arrow)" />

  <text x="600" y="246" text-anchor="middle" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">Train → Detect Boundary → Generate → Validate → Replay → Train</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0F172A">
    <rect x="42" y="280" width="175" height="90" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <text x="129" y="316" text-anchor="middle" font-size="15" font-weight="700">Train</text>
    <text x="129" y="340" text-anchor="middle" font-size="12">policy rollouts</text>

    <rect x="252" y="280" width="175" height="90" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="339" y="310" text-anchor="middle" font-size="15" font-weight="700">Detect Boundary</text>
    <text x="339" y="338" text-anchor="middle" font-size="12">K rollouts + progress</text>

    <rect x="462" y="280" width="175" height="90" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="549" y="310" text-anchor="middle" font-size="15" font-weight="700">Generate</text>
    <text x="549" y="338" text-anchor="middle" font-size="12">online synthetic traces</text>

    <rect x="672" y="280" width="175" height="90" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <text x="759" y="310" text-anchor="middle" font-size="15" font-weight="700">Validate</text>
    <text x="759" y="338" text-anchor="middle" font-size="12">real VM + semantic guards</text>

    <rect x="882" y="280" width="175" height="90" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <text x="969" y="310" text-anchor="middle" font-size="15" font-weight="700">Replay</text>
    <text x="969" y="338" text-anchor="middle" font-size="12">eligible next epoch</text>
  </g>

  <path d="M217 325H242" fill="none" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#arrow)" />
  <path d="M427 325H452" fill="none" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#arrow)" />
  <path d="M637 325H662" fill="none" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#arrow)" />
  <path d="M847 325H872" fill="none" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#arrow)" />
  <path d="M969 370V432H129V380" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-dark)" />

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0F172A">
    <rect x="120" y="414" width="960" height="54" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <text x="600" y="447" text-anchor="middle" font-size="14">Only validated candidates enter the replay pool; same-epoch leakage is disallowed.</text>
  </g>
</svg>
