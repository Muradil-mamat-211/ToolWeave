schema_version: toolweave.runtime.v1
runtime:
  cluster_mode: local
  data:
    dataloader_num_workers: 0
  roles:
    learner:
      nodes:
        node-0: [1]
      cpu_cores: 32
      ram_gib: 110
    generator:
      nodes:
        node-0: [0]
      cpu_cores: 16
      ram_gib: 110
  ray:
    num_cpus: auto
    cpus_per_worker: 1
    placement_strategy: STRICT_PACK
    address: null
  rollout:
    backend: sglang
    tensor_parallel_size: 1
    data_parallel_size: auto
    replicas: auto
    gpu_memory_utilization: 0.45
    max_num_batched_tokens: 131072
    max_model_len: 32768
    multi_stage_wake_up: true
  fsdp:
    world_size: auto
    sequence_parallel_size: 1
    gradient_checkpointing: true
    activation_offload: false
    use_remove_padding: true
    use_fused_kernels: true
    actor_param_offload: false
    actor_optimizer_offload: false
    reference_param_offload: true
  batching:
    dynamic: true
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    actor_micro_batch_size_per_gpu: 2
    actor_max_token_len_per_gpu: 32768
    rollout_logprob_micro_batch_size_per_gpu: 1
    rollout_logprob_max_token_len_per_gpu: 65536
    reference_logprob_micro_batch_size_per_gpu: 1
    reference_logprob_max_token_len_per_gpu: 65536
  generator:
    enabled: true
    backend: vllm_openai
    host: 127.0.0.1
    port: 8000
    tensor_parallel_size: 1
    dtype: bfloat16
    max_model_len: 24576
    gpu_memory_utilization: 0.90
    backend_concurrency: 4
    seed_workers: 4
