# Repo-aligned static profile for Qwen3-4B on 2 x 48 GB.
# Source: EnvTuning config + Stage 1 shell at AWorld-RL be52dbf.
# Its hardware-only overrides were GPU-smoke-validated and it must still not be
# run without the guard script.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

custom_reward_function:
  path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/format_reward.py
  name: compute_score

data:
  train_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/bfcl_stage1_train_base_100.parquet
  val_files: /root/autodl-tmp/rods-workspace/stage1_format_rl/data/bfcl_val_400.parquet
  max_prompt_length: 8192
  # Smoke validation found a 3.1% response-cap hit at 10000 tokens. 16384
  # preserved all targeted worst-case K=16 trajectories without a cap hit.
  max_response_length: 16384
  train_batch_size: 4
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: /root/autodl-tmp/rods-workspace/models/Qwen3-4B
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_fused_kernels: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    # Dynamic micro-batch packing budget. This splits complete trajectories
    # across gradient-accumulation micro-batches; it does not truncate data.
    ppo_max_token_len_per_gpu: 32768
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    use_kl_loss: true
    kl_loss_coef: 0.1
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    grad_clip: 1.0
    entropy_coeff: 0.001
    loss_agg_mode: seq-mean-token-mean
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: sglang
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 16
    tensor_model_parallel_size: 1
    # 0.80 OOMed during weight synchronization; 0.75 passed 64-way rollout
    # and a complete distributed optimizer update.
    gpu_memory_utilization: 0.75
    max_num_batched_tokens: 131072
    max_model_len: 32768
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    multi_turn:
      enable: true
      # The public YAML's `max_turns: 100` is unused by this veRL commit.
      # These executable keys preserve its apparent intended limit.
      max_assistant_turns: 100
      max_user_turns: 100
      interaction_config_path: /root/autodl-tmp/rods-workspace/code/AWorld-RL-stage1-worktree/EnvTuning/env_tuning/config/multi_turn_fc_interaction_config.yaml
      format: qwen
      use_inference_chat_template: false
      tokenization_sanity_check_mode: "off"
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    entropy_from_logits_with_chunking: true
    fsdp_config:
      param_offload: false

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  loss_agg_mode: seq-mean-token-mean
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

reward_model:
  enable: false
  reward_manager: bfcl

trainer:
  critic_warmup: 0
  logger:
    - console
    - tensorboard
  project_name: rods_stage1_format_rl
  experiment_name: qwen3_4b_k16_repo_aligned_2gpu
  rollout_data_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/repo_aligned_rollouts
  default_local_dir: /root/autodl-tmp/rods-workspace/stage1_format_rl/artifacts/repo_aligned_checkpoints
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: 5
  test_freq: 1
  total_epochs: 20
