<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 930" role="img" aria-labelledby="title desc">
  <title id="title">ToolWeave implementation-aligned Stage 1 to Stage 3 pipeline</title>
  <desc id="desc">A staged curriculum from Qwen3-4B through a Stage 1 format and executable-tool reward, a Stage 2 fixed-denominator Progress Reward, and a Stage 3 closed loop. Stage 3 uses Progress Reward alone for global GRPO and boundary selection, sends selected seeds through verified synthesis, admits candidates at the next epoch boundary, and adds a MatchTIR-inspired local residual only on actor tool-call tokens.</desc>

  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#0F766E" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#C2410C" />
    </marker>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#1D4ED8" />
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0F172A; }
      .title { font-size: 23px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #64748B; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-copy { font-size: 12px; fill: #334155; }
      .tiny { font-size: 10.5px; fill: #475569; }
    </style>
  </defs>

  <rect x="12" y="12" width="1436" height="906" rx="28" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />

  <text x="730" y="47" text-anchor="middle" class="font title">ToolWeave · staged curriculum and verified online RL</text>
  <text x="730" y="71" text-anchor="middle" class="font subtitle">Stage 1/2 completed · implementation-aligned Stage 3 branch · formal Stage 3 training pending</text>

  <text x="50" y="103" class="font label">STAGED CURRICULUM</text>

  <!-- Curriculum row -->
  <g class="font">
    <rect x="50" y="122" width="230" height="116" rx="18" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
    <text x="165" y="158" text-anchor="middle" class="box-title">Qwen3-4B</text>
    <text x="165" y="183" text-anchor="middle" class="box-copy">verified starting</text>
    <text x="165" y="202" text-anchor="middle" class="box-copy">checkpoint</text>

    <rect x="340" y="122" width="250" height="116" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <text x="465" y="158" text-anchor="middle" class="box-title">Stage 1</text>
    <text x="465" y="183" text-anchor="middle" class="box-copy">GRPO · K = 16</text>
    <text x="465" y="202" text-anchor="middle" class="box-copy">format + tool score [0, 2]</text>

    <rect x="650" y="122" width="250" height="116" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
    <text x="775" y="158" text-anchor="middle" class="box-title">Stage 2</text>
    <text x="775" y="183" text-anchor="middle" class="box-copy">fixed-denominator R_P</text>
    <text x="775" y="202" text-anchor="middle" class="box-copy">GRPO · loss KL = 0.01</text>

    <rect x="960" y="116" width="450" height="128" rx="18" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="1185" y="150" text-anchor="middle" class="box-title">Stage 3 · boundary-guided online RL</text>
    <text x="1185" y="176" text-anchor="middle" class="box-copy">global: unchanged R_P → A_RODS</text>
    <text x="1185" y="196" text-anchor="middle" class="box-copy">local: per-user-turn call credit</text>
    <text x="1185" y="216" text-anchor="middle" class="box-copy">A_new = A_RODS + 1.0 A_local</text>
  </g>

  <path d="M280 180H325" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M590 180H635" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M900 180H945" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />

  <path d="M50 271H1410" fill="none" stroke="#CBD5E1" stroke-width="2" />
  <text x="50" y="298" class="font section">STAGE 3 · TRAINING-BRANCH ORDER</text>
  <text x="50" y="320" class="font subtitle">RODS-style lifecycle mechanisms are marked in teal; ToolWeave-specific validation and local credit are marked in orange.</text>

  <!-- Legend -->
  <g class="font">
    <rect x="920" y="280" width="116" height="25" rx="12" fill="#E6FFFB" stroke="#0F766E" stroke-width="1.5" />
    <text x="978" y="297" text-anchor="middle" class="tiny">RODS-style</text>
    <rect x="1048" y="280" width="156" height="25" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" />
    <text x="1126" y="297" text-anchor="middle" class="tiny">ToolWeave-specific</text>
    <rect x="1216" y="280" width="112" height="25" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5" />
    <text x="1272" y="297" text-anchor="middle" class="tiny">policy update</text>
  </g>

  <!-- Rollout and boundary row -->
  <g class="font">
    <rect x="50" y="340" width="260" height="104" rx="16" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
    <text x="180" y="373" text-anchor="middle" class="box-title">Active pool + policy</text>
    <text x="180" y="398" text-anchor="middle" class="box-copy">original seeds + generated rows</text>
    <text x="180" y="418" text-anchor="middle" class="box-copy">current actor checkpoint</text>

    <rect x="360" y="340" width="260" height="104" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="490" y="373" text-anchor="middle" class="box-title">K = 16 rollouts</text>
    <text x="490" y="398" text-anchor="middle" class="box-copy">multi-turn BFCL environment</text>
    <text x="490" y="418" text-anchor="middle" class="box-copy">grouped by prompt identity</text>

    <rect x="670" y="340" width="260" height="104" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="800" y="373" text-anchor="middle" class="box-title">Progress Reward R_P</text>
    <text x="800" y="398" text-anchor="middle" class="box-copy">R_P = successful turns / expected turns</text>
    <text x="800" y="418" text-anchor="middle" class="box-copy">pure global signal · no local reward</text>

    <rect x="980" y="340" width="260" height="104" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="1110" y="373" text-anchor="middle" class="box-title">Boundary classification</text>
    <text x="1110" y="398" text-anchor="middle" class="box-copy">too hard · boundary · mastered</text>
    <text x="1110" y="418" text-anchor="middle" class="box-copy">r̄_P only · φ = 4r̄_P(1−r̄_P)</text>
  </g>

  <path d="M310 392H350" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M620 392H660" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M930 392H970" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M1110 444V476" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />

  <!-- Synthesis and validation row, intentionally read right to left -->
  <g class="font">
    <rect x="50" y="488" width="260" height="112" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="180" y="520" text-anchor="middle" class="box-title">Validate + package</text>
    <text x="180" y="541" text-anchor="middle" class="box-copy">coherence rewrite + MF/MP transform</text>
    <text x="180" y="561" text-anchor="middle" class="box-copy">semantic gates + fresh-VM reverify</text>
    <text x="180" y="581" text-anchor="middle" class="box-copy">Quality Judge → validated candidate</text>

    <rect x="360" y="488" width="260" height="112" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="490" y="520" text-anchor="middle" class="box-title">BFCL VM + query</text>
    <text x="490" y="545" text-anchor="middle" class="box-copy">execute sampled calls in the VM</text>
    <text x="490" y="565" text-anchor="middle" class="box-copy">generate + verify user queries</text>

    <rect x="670" y="488" width="260" height="112" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="800" y="520" text-anchor="middle" class="box-title">Planner + function sampling</text>
    <text x="800" y="545" text-anchor="middle" class="box-copy">plan multi-turn intent</text>
    <text x="800" y="565" text-anchor="middle" class="box-copy">sample functions + parameters</text>

    <rect x="980" y="488" width="260" height="112" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="1110" y="520" text-anchor="middle" class="box-title">Boundary seed queue</text>
    <text x="1110" y="545" text-anchor="middle" class="box-copy">cooldown + φ rank + type quota</text>
    <text x="1110" y="565" text-anchor="middle" class="box-copy">selected seeds only → generator</text>
  </g>

  <path d="M980 544H940" fill="none" stroke="#C2410C" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <path d="M670 544H630" fill="none" stroke="#C2410C" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <path d="M360 544H320" fill="none" stroke="#C2410C" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <path d="M180 600V642" fill="none" stroke="#C2410C" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  <!-- Replay and policy optimization row -->
  <g class="font">
    <rect x="50" y="650" width="260" height="132" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5" />
    <text x="180" y="682" text-anchor="middle" class="box-title">Epoch n · staged</text>
    <text x="180" y="707" text-anchor="middle" class="box-copy">generated + fully validated</text>
    <text x="180" y="727" text-anchor="middle" class="box-copy">not eligible in the same epoch</text>
    <text x="180" y="755" text-anchor="middle" class="tiny">candidate queue</text>

    <rect x="360" y="650" width="260" height="132" rx="16" fill="#E6FFFB" stroke="#0F766E" stroke-width="2.5" />
    <text x="490" y="682" text-anchor="middle" class="box-title">Epoch n + 1 · replay</text>
    <text x="490" y="707" text-anchor="middle" class="box-copy">admit at epoch boundary</text>
    <text x="490" y="727" text-anchor="middle" class="box-copy">≤ 20% injection · cap 400</text>
    <text x="490" y="755" text-anchor="middle" class="tiny">retire mastered / too-hard rows</text>

    <rect x="670" y="650" width="260" height="132" rx="16" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
    <text x="800" y="682" text-anchor="middle" class="box-title">Policy optimization</text>
    <text x="800" y="707" text-anchor="middle" class="box-copy">global: group z(R_P) = A_RODS</text>
    <text x="800" y="727" text-anchor="middle" class="box-copy">local: call → step mean → return</text>
    <text x="800" y="747" text-anchor="middle" class="box-copy">ragged z → tool-call tokens only</text>
    <text x="800" y="768" text-anchor="middle" class="tiny">A_new = A_RODS + 1.0 A_local</text>

    <rect x="980" y="650" width="260" height="132" rx="16" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
    <text x="1110" y="682" text-anchor="middle" class="box-title">Updated policy</text>
    <text x="1110" y="707" text-anchor="middle" class="box-copy">actor optimizer step</text>
    <text x="1110" y="727" text-anchor="middle" class="box-copy">new policy for the next rollout</text>
    <text x="1110" y="755" text-anchor="middle" class="tiny">closed-loop continuation</text>
  </g>

  <path d="M310 716H350" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrow-teal)" />
  <path d="M620 716H660" fill="none" stroke="#1D4ED8" stroke-width="3.5" marker-end="url(#arrow-navy)" />
  <path d="M930 716H970" fill="none" stroke="#1D4ED8" stroke-width="3.5" marker-end="url(#arrow-navy)" />

  <!-- Dedicated outer loop lane: no line crosses a box or the explanatory note. -->
  <path d="M1110 782V850H28V392H50" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-navy)" />
  <text x="700" y="837" text-anchor="middle" class="font tiny" fill="#1D4ED8">updated policy → next rollout group</text>
  <text x="730" y="890" text-anchor="middle" class="font subtitle">Validated candidates become eligible only at the next epoch boundary; same-epoch leakage is blocked.</text>
</svg>
